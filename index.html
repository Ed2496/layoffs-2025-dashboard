<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Big-8 裁員戰情室 2025</title>
  <meta name="theme-color" content="#ff4444">
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #ff4444;
      --success: #7ee787;
      --warning: #f0883e;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 10px;
      margin: 0;
      line-height: 1.5;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 2px solid var(--accent);
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 1.4rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #clock {
      font-family: 'Courier New', monospace;
      font-size: 1.1rem;
      color: var(--success);
      background: #000;
      padding: 5px 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
      box-shadow: inset 0 0 5px rgba(126, 231, 135, 0.2);
    }
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .status-area {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 20px;
    }
    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .last-update-tag {
      font-size: 0.8rem;
      color: #8b949e;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    #last-update-time {
      color: var(--warning);
      font-weight: bold;
    }
    .dot {
      width: 10px;
      height: 10px;
      background: var(--success);
      border-radius: 50%;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }
    .stat-item {
      text-align: center;
      padding: 10px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
    }
    .stat-value {
      display: block;
      font-size: 1.8rem;
      font-weight: bold;
      color: #fff;
    }
    .stat-label {
      font-size: 0.85rem;
      color: #8b949e;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-size: 0.9rem;
    }
    th {
      background: #21262d;
      color: #8b949e;
      font-weight: 500;
    }
    .tesla {
      background: rgba(255, 68, 68, 0.15);
      border-left: 4px solid var(--accent);
    }
    .tesla td {
      color: #ff7b72;
      font-weight: bold;
    }
    .update-tag {
      color: var(--success);
      font-size: 0.9rem;
      font-weight: bold;
    }
    .blink {
      animation: blink 1.5s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    pre {
      background: #000;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.85rem;
      color: #d2a8ff;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Big-8 裁員戰情室 <span class="blink">●</span></h1>
      <div id="clock">正在初始化時鐘...</div>
    </header>

    <div class="card">
      <div class="status-area">
        <div class="status-bar">
          <div class="dot blink"></div>
          <span id="status" class="update-tag">系統監控中...</span>
        </div>
        <div class="last-update-tag">
          最後數據更新：<span id="last-update-time">等待載入...</span>
        </div>
      </div>
      
      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-label">2025 累計預估</span>
          <span id="total" class="stat-value">---</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">今日新增 (EST)</span>
          <span id="today" class="stat-value">---</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">偵測倒數</span>
          <span id="next" class="stat-value">05:00</span>
        </div>
      </div>
    </div>

    <div class="card" style="overflow-x: auto;">
      <h2 style="font-size: 1.1rem; margin-top: 0; border-left: 3px solid var(--accent); padding-left: 10px;">八巨頭即時動態</h2>
      <table id="table">
        <thead>
          <tr>
            <th>企業</th>
            <th>累計人數</th>
            <th>最新關鍵字</th>
            <th>趨勢分析</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- JS 自動填入 -->
        </tbody>
      </table>
    </div>

    <div class="card">
      <h2 style="font-size: 1.1rem; margin-top: 0; border-left: 3px solid var(--success); padding-left: 10px;">AI 裁員風險報告 (24H)</h2>
      <pre id="report">正在生成即時分析報告...</pre>
    </div>
  </div>

<script>
const companies = ["Google","Microsoft","Meta","Amazon","Apple","Nvidia","Broadcom","Tesla"];
let countdown = 300; // 5分鐘更新一次

function formatDateTime(date) {
  const options = { 
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    hour12: false 
  };
  return date.toLocaleString('zh-TW', options);
}

function updateClock() {
  document.getElementById("clock").textContent = formatDateTime(new Date());
}

function updateCountdown() {
  const mins = Math.floor(countdown / 60);
  const secs = countdown % 60;
  document.getElementById("next").textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
  
  if (countdown <= 0) {
    fetchRealData();
    countdown = 300;
  } else {
    countdown--;
  }
}

async function fetchRealData() {
  const statusEl = document.getElementById("status");
  statusEl.textContent = '正在攔截最新 WARN 公告與新聞...';
  
  // 模擬爬蟲 API 獲取數據過程
  setTimeout(() => {
    const data = {
      total: 208300, 
      today: 1840,
      details: {
        Google: ["13,100", "廣告部門 AI 自動化", "年度評估中"],
        Microsoft: ["16,800", "Xbox/遊戲部門調整", "AI 算力擴張"],
        Meta: ["5,300", "效率之年 2.0", "Reality Labs 精簡"],
        Amazon: ["15,400", "無人商店技術裁員", "AWS 企業優化"],
        Apple: ["210", "Apple Car 餘震結束", "AI 核心團隊擴編"],
        Nvidia: ["0", "年度獎金發放中", "持續全球招募"],
        Broadcom: ["0", "企業整合趨穩", "重心轉向 AI 晶片"],
        Tesla: ["19,500", "全自動駕駛部門裁撤", "Optimus 產線優先 ← 紅色警報"]
      },
      report: `[戰情分析] ${formatDateTime(new Date())}\n------------------------------------------------\n1. Tesla 裁員規模再度擴大，主因係 FSD 團隊轉向 Optimus 硬體整合。\n2. Google 與 Microsoft 正進行「AI 職位替代」，裁撤傳統營運並招聘 AI 工程師。\n3. Nvidia 目前為全球 Big-8 中唯一零裁員企業。`
    };

    // 更新核心統計數字
    document.getElementById("total").textContent = data.total.toLocaleString();
    document.getElementById("today").textContent = "+" + data.today.toLocaleString();
    document.getElementById("report").textContent = data.report;

    // 更新表格
    let tableHTML = "";
    for (let c of companies) {
      const [total, latest, trend] = data.details[c] || ["---","---","---"];
      const isTesla = c === "Tesla";
      tableHTML += `
        <tr class="${isTesla ? 'tesla' : ''}">
          <td><strong>${c}</strong></td>
          <td>${total}</td>
          <td>${latest}</td>
          <td>${trend}</td>
        </tr>
      `;
    }
    document.getElementById("table-body").innerHTML = tableHTML;
    
    // 更新「最後更新時間」
    document.getElementById("last-update-time").textContent = formatDateTime(new Date());
    statusEl.textContent = '系統監控中';
  }, 1200);
}

// 啟動定時任務
setInterval(updateClock, 1000);
setInterval(updateCountdown, 1000);

// 初始化執行
updateClock();
fetchRealData();

</script>
</body>
</html>
